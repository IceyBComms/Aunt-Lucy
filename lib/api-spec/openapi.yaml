openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pages
    description: Support page operations
  - name: slots
    description: Slot operations
  - name: gifts
    description: Gift experience operations
  - name: manage
    description: Token-gated recipient management — contacts and the Aunt Lucy invite/trickle
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /pages/{slug}:
    get:
      operationId: getSupportPage
      tags: [pages]
      summary: Get a support page by slug
      description: Returns page details and all slots. For PIN-protected pages, requires the PIN to be passed as a query parameter.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: pin
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Support page found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportPageWithSlots"
        "401":
          description: PIN required or incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinRequiredError"
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /slots/{slotId}/claim:
    post:
      operationId: claimSlot
      tags: [slots]
      summary: Claim a slot
      description: Claim an open slot. Returns 409 if already claimed.
      parameters:
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimSlotRequest"
      responses:
        "200":
          description: Slot claimed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotResponse"
        "401":
          description: PIN required or incorrect (for PIN-protected pages)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinRequiredError"
        "409":
          description: Slot already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "404":
          description: Slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /gift-tiers:
    get:
      operationId: listGiftTiers
      tags: [gifts]
      summary: List the gift tiers
      description: >-
        Returns every tier shown on the purchase page, including the ones that
        cannot be bought yet. Prices are GST-inclusive cents and come from the
        server so the buyer-facing price can never drift from what Stripe
        charges. A tier with sellable=false is display-only — it carries no
        payment link and POST /gifts refuses it.
      responses:
        "200":
          description: The gift tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiftTier"

  /gifts:
    post:
      operationId: createGift
      tags: [gifts]
      summary: Start a gift purchase
      description: >-
        Creates the gift in `pending` status and returns the Stripe checkout URL
        to send the buyer to. The URL already carries `client_reference_id` set
        to the new gift's id — that is the handshake the Stripe webhook uses to
        match the payment back to this gift, so the caller must redirect to the
        returned URL unchanged. Nothing is charged and nothing is emailed until
        the payment completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiftRequest"
      responses:
        "201":
          description: Gift created and ready for payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGiftResponse"
        "400":
          description: Missing details, or a tier that cannot be bought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /gifts/{redemptionToken}:
    get:
      operationId: getGift
      tags: [gifts]
      summary: Get a gift experience by redemption token
      description: >-
        Returns the recipient-facing gift experience — recipient name, the
        organisation's message, who it was gifted by, the occasion, and all
        colleague signings. The gift is shown even before it has been delivered.
      parameters:
        - name: redemptionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftExperience"
        "404":
          description: Gift not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /gifts/{redemptionToken}/review:
    get:
      operationId: getGiftReview
      tags: [gifts]
      summary: Get the suggested tasks a recipient can steer before activating
      description: >-
        Token-gated, not auth-gated — the recipient has no account. Before
        activation this returns occasion-aware suggested tasks that are
        generated on the fly and not persisted. After activation it returns the
        live page instead, so re-opening the link is always safe.
      parameters:
        - name: redemptionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftReview"
        "404":
          description: Gift not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /gifts/{redemptionToken}/activate:
    post:
      operationId: activateGift
      tags: [gifts]
      summary: Turn the kept tasks into a live support page
      description: >-
        Creates the support page (with no organiser account), creates the kept
        tasks as slots, and marks the gift redeemed. Returns the page slug.
        Calling this again on an already-activated gift returns the existing
        page rather than an error.
      parameters:
        - name: redemptionToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateGiftRequest"
      responses:
        "200":
          description: Gift was already activated; the existing page is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedPage"
        "201":
          description: Support page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedPage"
        "404":
          description: Gift not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: Gift is not in a state that can be activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /sign/{signingToken}:
    get:
      operationId: getSignCard
      tags: [cards]
      summary: The card context for the signing page (public, no account)
      description: >-
        Keyed by the workplace card's public signing token. Returns the
        recipient's first name only, the organiser's name, the organisation
        name (if the organiser has set it), the ambient count of visible
        signings, and whether the card has been sealed (closed to new notes).
      parameters:
        - name: signingToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignCardContext"
        "404":
          description: Signing link not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    post:
      operationId: signCard
      tags: [cards]
      summary: Add a note to the card (public, no account)
      description: >-
        Creates a visible signing. Rejects a blank name, an empty or over-long
        message, a sealed card, and anything past the anti-abuse signer cap.
      parameters:
        - name: signingToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignCardRequest"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignCardResult"
        "400":
          description: Name or message failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Signing link not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: Card is sealed or full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"

  /card/{organiserToken}:
    get:
      operationId: getOrganiserCard
      tags: [cards]
      summary: The organiser's review view of the card
      description: >-
        Keyed by the private organiser token. Lists the visible notes, the share
        link to copy, and whether the card is sealed.
      parameters:
        - name: organiserToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserCardView"
        "404":
          description: Card link not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    patch:
      operationId: updateCardOrganisation
      tags: [cards]
      summary: Set the organisation name shown on the card
      parameters:
        - name: organiserToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardOrganisationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCardOrganisationResponse"
        "404":
          description: Card link not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /card/{organiserToken}/signings/{id}/remove:
    post:
      operationId: removeSigning
      tags: [cards]
      summary: Soft-remove a note from the card (organiser only)
      description: >-
        Sets the note's status to removed — the row is kept for audit but never
        shows on the card or counts. Idempotent and scoped to this card.
      parameters:
        - name: organiserToken
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Card link or note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: Card already sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"

  /card/{organiserToken}/seal:
    post:
      operationId: sealCard
      tags: [cards]
      summary: Send the card — seal it and deliver the keepsake
      description: >-
        Seals the card to new notes and triggers delivery of the keepsake to the
        recipient (now, or on the buyer's chosen delivery date). Idempotent — a
        card already sealed answers cleanly rather than delivering twice.
      parameters:
        - name: organiserToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card sealed (or already sealed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealCardResponse"
        "404":
          description: Card link not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /manage/{token}:
    get:
      operationId: getManageState
      tags: [manage]
      summary: The recipient's management view of their page
      description: >-
        Token-gated by the private per-page management token. Returns the page
        details, tasks, contacts and the state of every invite sent or queued.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Management state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageState"
        "401":
          description: Invalid or revoked management token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /manage/{token}/details:
    patch:
      operationId: updateManageDetails
      tags: [manage]
      summary: Update the recipient's pronoun and situation line
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDetailsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageDetails"
        "400":
          description: Nothing to update or invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /manage/{token}/contacts:
    post:
      operationId: addContact
      tags: [manage]
      summary: Add a contact (name + mobile and/or email, optional trusted tag)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddContactRequest"
      responses:
        "201":
          description: Contact added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageContact"
        "400":
          description: Invalid contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /manage/{token}/contacts/{contactId}:
    patch:
      operationId: updateContact
      tags: [manage]
      summary: Edit a contact
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageContact"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    delete:
      operationId: deleteContact
      tags: [manage]
      summary: Remove a contact
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

  /manage/{token}/invites/preview:
    post:
      operationId: previewInvites
      tags: [manage]
      summary: Render the exact invite messages without sending
      description: >-
        Returns the rendered message per contact (the verbatim Aunt Lucy copy,
        with any personal opener) so the recipient can review before sending.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteBatchRequest"
      responses:
        "200":
          description: Rendered previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreviewResponse"

  /manage/{token}/invites/send:
    post:
      operationId: sendInvites
      tags: [manage]
      summary: Send invites now
      description: >-
        Sends immediately. For a bereavement page the request is refused with
        409 unless `confirmed` is true (self-share is the gentle default).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteBatchRequest"
      responses:
        "201":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResultsResponse"
        "409":
          description: Bereavement confirmation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BereavementGateError"

  /manage/{token}/invites/schedule:
    post:
      operationId: scheduleInvites
      tags: [manage]
      summary: Queue invites as a scheduled wave
      description: >-
        Queues the invites for the dispatcher to send at scheduledFor. Same
        bereavement gate as send.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteBatchRequest"
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResultsResponse"
        "409":
          description: Bereavement confirmation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BereavementGateError"

  /manage/{token}/tasks/{slotId}:
    patch:
      operationId: editTask
      tags: [manage]
      summary: Edit a task's time / date / details (Item 17)
      description: >-
        Edits time, date or details of a task and can flip its flexible/fixed
        flag. If the task is claimed the claim stands and the helper is always
        told (with a one-tap "can't any more" out). Sensitivity is not editable
        here.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTaskRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageTaskSummary"
        "400":
          description: Nothing to update or an invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Task not on this page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    delete:
      operationId: cancelTask
      tags: [manage]
      summary: Cancel a task (Item 17)
      description: >-
        Cancels a task. Unclaimed is a quiet removal; claimed always thanks the
        helper and tells them it's covered (bereavement pages get the gentler
        variant) before the task is removed.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Task not on this page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SlotType:
      type: string
      enum:
        - meal
        - school_pickup
        - child_care
        - errand
        - dog_walking
        - shopping
        - visit
        - other

    SlotResponse:
      type: object
      properties:
        id:
          type: string
        pageId:
          type: string
        slotType:
          $ref: "#/components/schemas/SlotType"
        customLabel:
          type: string
          nullable: true
        slotDate:
          type: string
          nullable: true
          description: >-
            Null means the task has no fixed date — a flexible offer, claimed
            whenever suits. The date is set when a helper claims it.
        slotTime:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        dietaryNotes:
          type: string
          nullable: true
          description: >-
            Meal slots only (bug #006): allergies / dietary preferences a helper
            needs before cooking. Null on every other slot type.
        headcount:
          type: integer
          nullable: true
          description: >-
            Meal slots only (bug #006): how many people the meal should feed.
            Null on every other slot type.
        isClaimed:
          type: boolean
        claimedByName:
          type: string
          nullable: true
        claimedNote:
          type: string
          nullable: true
        createdAt:
          type: string
        calendarUrl:
          type: string
          nullable: true
          description: >-
            webcal:// subscribe link to this claim's calendar feed. Populated
            ONLY on the response to POST /slots/{slotId}/claim, and only for a
            task with a date (an undated "whenever suits" offer isn't an
            appointment, so it's null). Absent/null everywhere else — the slot
            listing in GET /pages never sets it. Mirrors the trusted-invite
            claim response's calendarUrl field so both claim paths surface the
            same "Add to your calendar" link.
      required:
        - id
        - pageId
        - slotType
        - isClaimed
        - createdAt

    SupportPageWithSlots:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        recipientName:
          type: string
        situationDescription:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, pending_approval, active, closed]
        privacy:
          type: string
          enum: [open, pin_protected]
        goodToKnow:
          type: string
          nullable: true
          description: >-
            An optional free-text note from the recipient, shown to every
            helper. Null when they didn't leave one.
        helpingCount:
          type: integer
          description: >-
            Ambient presence — the number of distinct people helping (deduped by
            claimed contact), for the warm "N people helping" line. Carries the
            warmth without naming anyone, so it is safe to show to everyone.
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotResponse"
      required:
        - id
        - slug
        - recipientName
        - status
        - privacy
        - helpingCount
        - slots

    ClaimSlotRequest:
      type: object
      properties:
        firstName:
          type: string
        contact:
          type: string
        note:
          type: string
          nullable: true
        showName:
          type: boolean
          nullable: true
          description: >-
            The helper's opt-in choice: when true, their name is shown to other
            helpers on the public page; when false or omitted, only the recipient
            sees it (the public page shows an ambient count instead). Defaults to
            false — hidden by default, never surprised into being shown.
        pin:
          type: string
          nullable: true
          description: Required when claiming a slot on a PIN-protected page.
      required:
        - firstName
        - contact

    GiftOccasion:
      type: string
      enum:
        - new_baby
        - illness_recovery
        - bereavement
        - ongoing_support
        - other

    GiftTierId:
      type: string
      enum:
        - consumer_personal
        - workplace_individual
        - workplace_5pack
        - workplace_10pack

    GiftTier:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/GiftTierId"
        label:
          type: string
          description: The buyer-facing name of the tier.
        blurb:
          type: string
          description: One line explaining who the tier is for.
        amountCents:
          type: integer
          description: GST-inclusive price in cents.
        gifts:
          type: integer
          description: How many separate gift pages the tier buys.
        sellable:
          type: boolean
          description: >-
            False for the pack tiers, which are shown as coming soon until
            multi-gift fulfilment exists. A display-only tier has no payment
            link and cannot be purchased.
      required:
        - id
        - label
        - blurb
        - amountCents
        - gifts
        - sellable

    CreateGiftRequest:
      type: object
      properties:
        tierId:
          $ref: "#/components/schemas/GiftTierId"
        purchaserName:
          type: string
        purchaserEmail:
          type: string
          description: Where the receipt and the tax invoice are sent.
        forSelf:
          type: boolean
          description: >-
            True when the buyer is setting the page up for themselves. The
            recipient fields are then ignored and the buyer's own name and email
            are used.
        recipientName:
          type: string
          nullable: true
          description: Required unless forSelf is true.
        recipientEmail:
          type: string
          nullable: true
          description: >-
            Where the gift is delivered. Null when the buyer chose to pass the
            link on themselves — fulfilment then sends the link to the buyer
            instead and nothing reaches the recipient automatically.
        occasion:
          oneOf:
            - $ref: "#/components/schemas/GiftOccasion"
          nullable: true
        giftedByNote:
          type: string
          nullable: true
          description: The optional "from" note shown on the delivered gift.
        deliverAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the gift should reach the recipient. Null means as soon as the
            payment clears.
      required:
        - tierId
        - purchaserName
        - purchaserEmail
        - forSelf

    CreateGiftResponse:
      type: object
      properties:
        checkoutUrl:
          type: string
          description: >-
            The Stripe payment link with client_reference_id already appended.
            Redirect to it unchanged.
      required:
        - checkoutUrl

    GiftSigningPublic:
      type: object
      properties:
        signerName:
          type: string
        message:
          type: string
      required:
        - signerName
        - message

    GiftExperience:
      type: object
      properties:
        recipientName:
          type: string
        organisationMessage:
          type: string
          nullable: true
          description: The organisation's / gifter's message (from gifted_by_note).
        giftedBy:
          type: string
          description: Who the gift is from (the purchaser's name).
        occasion:
          oneOf:
            - $ref: "#/components/schemas/GiftOccasion"
          nullable: true
        isTeamCard:
          type: boolean
          description: >-
            True for a workplace team card, false for a consumer gift. Derived
            from the gift's signing token — no new stored field. Lets the
            keepsake word its notes section for the right audience.
        signings:
          type: array
          items:
            $ref: "#/components/schemas/GiftSigningPublic"
      required:
        - recipientName
        - giftedBy
        - isTeamCard
        - signings

    SignCardContext:
      type: object
      properties:
        recipientFirstName:
          type: string
        organiserName:
          type: string
        organisationName:
          type: string
          nullable: true
        signedCount:
          type: integer
        closed:
          type: boolean
          description: True once the card is sealed — no more notes accepted.
      required:
        - recipientFirstName
        - organiserName
        - organisationName
        - signedCount
        - closed

    SignCardRequest:
      type: object
      properties:
        signerName:
          type: string
          description: Required. A person or a group label like "the Finance team".
        message:
          type: string
          description: Required. Capped at ~500 characters server-side.
      required:
        - signerName
        - message

    SignCardResult:
      type: object
      properties:
        signedCount:
          type: integer
      required:
        - signedCount

    OrganiserCardSigning:
      type: object
      properties:
        id:
          type: string
        signerName:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - signerName
        - message
        - createdAt

    OrganiserCardView:
      type: object
      properties:
        recipientFirstName:
          type: string
        organisationName:
          type: string
          nullable: true
        signingLink:
          type: string
        sealed:
          type: boolean
        sealedAt:
          type: string
          format: date-time
          nullable: true
        signings:
          type: array
          items:
            $ref: "#/components/schemas/OrganiserCardSigning"
      required:
        - recipientFirstName
        - organisationName
        - signingLink
        - sealed
        - sealedAt
        - signings

    UpdateCardOrganisationRequest:
      type: object
      properties:
        organisationName:
          type: string
      required:
        - organisationName

    UpdateCardOrganisationResponse:
      type: object
      properties:
        organisationName:
          type: string
          nullable: true
      required:
        - organisationName

    SealCardResponse:
      type: object
      properties:
        sealed:
          type: boolean
        alreadySealed:
          type: boolean
        delivery:
          type: string
          nullable: true
          enum: [sent, scheduled, manual]
          description: How the keepsake was delivered. Absent when already sealed.
        giftLink:
          type: string
          nullable: true
          description: >-
            The recipient's gift link, returned only when there was no recipient
            email and the organiser must pass it on by hand.
      required:
        - sealed
        - alreadySealed

    SuggestedTask:
      type: object
      description: >-
        A proposed task shown on the review screen. Not persisted — it becomes a
        slot only if the recipient keeps it and activates.
      properties:
        key:
          type: string
        slotType:
          $ref: "#/components/schemas/SlotType"
        label:
          type: string
        dated:
          type: boolean
          description: >-
            When false the card shows no date at all — a flexible offer. Most
            suggestions are undated by design.
        trustedHelpersOnly:
          type: boolean
      required:
        - key
        - slotType
        - label
        - dated
        - trustedHelpersOnly

    GiftReview:
      type: object
      properties:
        activated:
          type: boolean
          description: >-
            True once the recipient has activated. The suggestions list is then
            empty and slug points at the live page.
        recipientName:
          type: string
        giftedBy:
          type: string
          nullable: true
        occasion:
          oneOf:
            - $ref: "#/components/schemas/GiftOccasion"
          nullable: true
        canActivate:
          type: boolean
          nullable: true
          description: False while the gift is unpaid or cancelled.
        slug:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        scheduledActivateAt:
          type: string
          nullable: true
          description: Set when the recipient chose a future go-live date.
        situationLine:
          type: string
          nullable: true
          description: >-
            The default (stage-agnostic) situation line for this occasion, shown
            as a ghost-text placeholder in the activation UI. May contain
            {poss}/{obj} pronoun tokens for the client to resolve. Null once
            activated.
        trustedLine:
          type: string
          nullable: true
          description: >-
            The default (stage-agnostic) trusted "support circle" line for this
            occasion, shown as a ghost-text placeholder for the trusted-invite
            field. May contain {poss}/{obj} pronoun tokens. Null once activated.
        recipientEmail:
          type: string
          nullable: true
          description: >-
            The recipient's email as we already hold it (from the gift), to
            prefill the "where should we reach you?" field at activation. Null
            when we hold none — the field is then asked for, not assumed.
        manageToken:
          type: string
          nullable: true
          description: Present once activated — the private management token.
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedTask"
      required:
        - activated
        - recipientName
        - suggestions

    ActivateGiftTask:
      type: object
      properties:
        slotType:
          $ref: "#/components/schemas/SlotType"
        label:
          type: string
        slotDate:
          type: string
          nullable: true
          description: Omit or null for a flexible, undated task.
        slotTime:
          type: string
          nullable: true
          description: >-
            Time of day (HH:MM), reusing the existing slot_time column. The
            activation review flow captures it mainly for school pickups (bug
            #005), where the time is the whole point; omit or null otherwise.
        notes:
          type: string
          nullable: true
        dietaryNotes:
          type: string
          nullable: true
          description: >-
            Meal tasks only (bug #006): allergies / dietary preferences. Ignored
            server-side for non-meal types.
        headcount:
          type: integer
          nullable: true
          description: >-
            Meal tasks only (bug #006): how many people the meal should feed.
            Ignored server-side for non-meal types.
        trustedHelpersOnly:
          type: boolean
      required:
        - slotType
        - label

    RecipientPronouns:
      type: string
      enum:
        - she_her
        - he_him
        - they_them
      description: >-
        How the recipient is referred to in the helper invite copy. Defaults to
        they_them so nothing is ever assumed.

    BabyStage:
      type: string
      enum:
        - expecting
        - arrived
      description: >-
        new_baby pages only: whether the baby has arrived yet, so the invite copy
        reads true either side of the birth (baby showers are gifted ahead of the
        event). Null/omitted means "not asked" and falls back to a stage-agnostic
        default. Ignored for every other occasion.

    ActivateGiftRequest:
      type: object
      properties:
        tasks:
          type: array
          description: The tasks the recipient kept, in the wording they kept them in.
          items:
            $ref: "#/components/schemas/ActivateGiftTask"
        scheduledActivateAt:
          type: string
          nullable: true
          description: >-
            Omit to go live now. Supply a future ISO timestamp to create the
            page as a draft that the scheduler makes visible on that date.
        goodToKnow:
          type: string
          nullable: true
          description: >-
            Optional free-text note shown to every helper on the live page.
            Trimmed and capped server-side; omit or null for none.
        recipientPronouns:
          oneOf:
            - $ref: "#/components/schemas/RecipientPronouns"
          nullable: true
          description: Defaults to they_them when omitted.
        situationLine:
          type: string
          nullable: true
          description: >-
            The short, deliberately-vague phrase used in the standard invite copy
            ("Sarah's <situationLine>"). Omit or null to fall back to the occasion
            (and baby_stage) default at send time — the default is NOT baked in,
            so a later baby_stage change updates it.
        trustedLine:
          type: string
          nullable: true
          description: >-
            The trusted "support circle" counterpart to situationLine
            ("Sarah's <trustedLine>, and thought you might…"). Omit or null to
            fall back to the occasion (and baby_stage) default at send time.
        babyStage:
          oneOf:
            - $ref: "#/components/schemas/BabyStage"
          nullable: true
          description: >-
            new_baby only — whether the baby has arrived. Steers which
            stage-appropriate default the invite/situation/trusted lines use. Omit
            or null when not asked.
        recipientEmail:
          type: string
          nullable: true
          description: >-
            Where to reach the recipient about their own page — used for the
            claim notifications. Captured at activation (prefilled from the gift
            when held, asked for when not). Omit or null to skip; notifications
            then don't fire until an email is added via /manage.
        recipientMobile:
          type: string
          nullable: true
          description: >-
            Optional mobile for future SMS updates. Stored when supplied; no SMS
            is sent yet.
      required:
        - tasks

    ActivatedPage:
      type: object
      properties:
        slug:
          type: string
        status:
          type: string
        scheduledActivateAt:
          type: string
          nullable: true
        manageToken:
          type: string
          nullable: true
          description: >-
            The private per-page management token — the recipient's re-entry
            credential for adding people and sending invites. Not the public
            slug or gift link.
      required:
        - slug
        - status

    PinRequiredError:
      type: object
      properties:
        error:
          type: string
        pinRequired:
          type: boolean
      required:
        - error
        - pinRequired

    ValidationError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    NotFoundError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ConflictError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    InviteKind:
      type: string
      enum:
        - general
        - trusted
        - second_wave

    InviteChannel:
      type: string
      enum:
        - sms
        - email

    SlotFlexibility:
      type: string
      description: >-
        Whether the time of a task is the helper's to nudge (flexible) or the
        family's fact (fixed). Item 17.
      enum:
        - flexible
        - fixed

    ManageTaskSummary:
      type: object
      properties:
        id:
          type: string
        slotType:
          $ref: "#/components/schemas/SlotType"
        label:
          type: string
        customLabel:
          type: string
          nullable: true
          description: The raw custom label (the edit form's value; `label` is display).
        notes:
          type: string
          nullable: true
        flexibility:
          $ref: "#/components/schemas/SlotFlexibility"
        trustedHelpersOnly:
          type: boolean
        isClaimed:
          type: boolean
        claimedByName:
          type: string
          nullable: true
          description: >-
            Who claimed it. Always present to the recipient/manager regardless of
            the helper's public-visibility choice — this is the "look who showed
            up" payoff and is safe because it is shown only to the person the
            help is for.
        claimedNote:
          type: string
          nullable: true
          description: The helper's optional message to the recipient, if left.
        claimedAt:
          type: string
          nullable: true
          description: When it was claimed (ISO), for the "help arriving" view.
        slotDate:
          type: string
          nullable: true
        slotTime:
          type: string
          nullable: true
        dietaryNotes:
          type: string
          nullable: true
          description: Meal slots only (bug #006). Null on every other slot type.
        headcount:
          type: integer
          nullable: true
          description: Meal slots only (bug #006). Null on every other slot type.
      required:
        - id
        - slotType
        - label
        - flexibility
        - trustedHelpersOnly
        - isClaimed

    ManageContact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mobile:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        trusted:
          type: boolean
        optedOut:
          type: boolean
      required:
        - id
        - name
        - trusted
        - optedOut

    ManageInvite:
      type: object
      properties:
        id:
          type: string
        contactId:
          type: string
          nullable: true
        name:
          type: string
        kind:
          $ref: "#/components/schemas/InviteKind"
        channel:
          $ref: "#/components/schemas/InviteChannel"
        status:
          type: string
          enum: [queued, sent, failed, cancelled]
        scheduledFor:
          type: string
        sentAt:
          type: string
          nullable: true
        claimedAt:
          type: string
          nullable: true
      required:
        - id
        - name
        - kind
        - channel
        - status
        - scheduledFor

    ManageState:
      type: object
      properties:
        role:
          type: string
          enum: [recipient, manager]
        recipientName:
          type: string
        slug:
          type: string
        status:
          type: string
        occasion:
          oneOf:
            - $ref: "#/components/schemas/GiftOccasion"
          nullable: true
        recipientPronouns:
          $ref: "#/components/schemas/RecipientPronouns"
        situationLine:
          type: string
          nullable: true
          description: >-
            The RAW stored standard-invite override, or null when using the
            default. Null lets the UI show the field as empty with ghost text.
        situationLineDefault:
          type: string
          nullable: true
          description: >-
            The occasion (and baby_stage) default for the standard line, shown as
            the placeholder. May contain {poss}/{obj} tokens the client resolves.
        trustedLine:
          type: string
          nullable: true
          description: >-
            The RAW stored trusted "support circle" override, or null when using
            the default.
        trustedLineDefault:
          type: string
          nullable: true
          description: >-
            The occasion (and baby_stage) default for the trusted line, shown as
            the placeholder. May contain {poss}/{obj} tokens the client resolves.
        babyStage:
          oneOf:
            - $ref: "#/components/schemas/BabyStage"
          nullable: true
          description: >-
            new_baby only — the stored baby stage, or null when not asked.
            Flipping it here updates the default wording for invites sent after.
        recipientEmail:
          type: string
          nullable: true
          description: >-
            Where the recipient is notified when help arrives. Editable here so a
            recipient who skipped it at activation can add it. Null when none.
        recipientMobile:
          type: string
          nullable: true
          description: Optional mobile for future SMS updates. Null when none.
        bereavement:
          type: boolean
          description: When true the UI leads with self-share and waves are gated.
        shareLink:
          type: string
        cardKeepsakeUrl:
          type: string
          nullable: true
          description: >-
            The "See your card 💛" re-entry link to the sealed workplace team
            card keepsake. Null unless this page came from a sealed card gift.
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ManageTaskSummary"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ManageContact"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/ManageInvite"
      required:
        - role
        - recipientName
        - slug
        - status
        - recipientPronouns
        - bereavement
        - shareLink
        - tasks
        - contacts
        - invites

    ManageDetails:
      type: object
      properties:
        recipientPronouns:
          $ref: "#/components/schemas/RecipientPronouns"
        situationLine:
          type: string
          nullable: true
        trustedLine:
          type: string
          nullable: true
        babyStage:
          oneOf:
            - $ref: "#/components/schemas/BabyStage"
          nullable: true
        recipientEmail:
          type: string
          nullable: true
        recipientMobile:
          type: string
          nullable: true
      required:
        - recipientPronouns

    UpdateDetailsRequest:
      type: object
      properties:
        recipientPronouns:
          $ref: "#/components/schemas/RecipientPronouns"
        situationLine:
          type: string
          nullable: true
        trustedLine:
          type: string
          nullable: true
          description: >-
            Set/clear the trusted "support circle" line override. Empty or null
            clears it back to the occasion (and baby_stage) default.
        babyStage:
          oneOf:
            - $ref: "#/components/schemas/BabyStage"
          nullable: true
          description: >-
            new_baby only — set/clear the baby stage. An empty or unrecognised
            value clears it to null (stage-agnostic default). Changing it updates
            the default wording for invites sent from then on.
        recipientEmail:
          type: string
          nullable: true
          description: >-
            Set/clear where claim notifications are sent. Send an empty string or
            null to clear; a non-empty value must look like an email address.
        recipientMobile:
          type: string
          nullable: true
          description: Set/clear the optional mobile for future SMS updates.

    EditTaskRequest:
      type: object
      description: >-
        Item 17 — the family editing a task's time / date / details, and
        optionally flipping its flexible/fixed flag. Every field is optional; only
        those present are changed. Sensitivity (trustedHelpersOnly) is
        deliberately not editable here.
      properties:
        slotDate:
          type: string
          nullable: true
          description: YYYY-MM-DD, or empty/null to clear (an undated flexible offer).
        slotTime:
          type: string
          nullable: true
          description: HH:MM (24h), or empty/null to clear.
        customLabel:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        dietaryNotes:
          type: string
          nullable: true
          description: Meal tasks only; ignored on other types.
        headcount:
          type: integer
          nullable: true
          description: Meal tasks only; ignored on other types.
        flexibility:
          $ref: "#/components/schemas/SlotFlexibility"

    AddContactRequest:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        trusted:
          type: boolean
      required:
        - name

    UpdateContactRequest:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        trusted:
          type: boolean

    InviteRequestItem:
      type: object
      properties:
        contactId:
          type: string
        slotId:
          type: string
          nullable: true
          description: Set to ask this person about one sensitive (trusted) task.
        kind:
          oneOf:
            - $ref: "#/components/schemas/InviteKind"
          nullable: true
          description: Inferred when omitted (trusted if slotId is set, else general).
        openingLine:
          type: string
          nullable: true
          description: The recipient's optional personal opener, shown above the verbatim body.
      required:
        - contactId

    InviteBatchRequest:
      type: object
      properties:
        confirmed:
          type: boolean
          description: Required true to send/schedule on a bereavement page.
        scheduledFor:
          type: string
          nullable: true
          description: ISO timestamp; used by the schedule endpoint only.
        invites:
          type: array
          items:
            $ref: "#/components/schemas/InviteRequestItem"
      required:
        - invites

    InvitePreview:
      type: object
      properties:
        contactId:
          type: string
        name:
          type: string
          nullable: true
        kind:
          oneOf:
            - $ref: "#/components/schemas/InviteKind"
          nullable: true
        channel:
          oneOf:
            - $ref: "#/components/schemas/InviteChannel"
          nullable: true
        subject:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
      required:
        - contactId

    InvitePreviewResponse:
      type: object
      properties:
        previews:
          type: array
          items:
            $ref: "#/components/schemas/InvitePreview"
      required:
        - previews

    InviteResult:
      type: object
      properties:
        contactId:
          type: string
        status:
          type: string
          enum: [sent, failed, queued, skipped]
        error:
          type: string
          nullable: true
      required:
        - contactId
        - status

    InviteResultsResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [now, schedule]
        results:
          type: array
          items:
            $ref: "#/components/schemas/InviteResult"
      required:
        - mode
        - results

    BereavementGateError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
